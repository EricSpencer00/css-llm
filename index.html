<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS LLM</title>
    <style>
      :root {
        --page: oklch(0.985 0.004 90);
        --ink: oklch(0.16 0.006 90);
        --muted: oklch(0.44 0.01 265);
        --rule: oklch(0.48 0.012 265);
        --accent: oklch(0.52 0.17 17);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html {
        min-width: 320px;
        background: var(--page);
      }

      body {
        min-width: 320px;
        max-width: 720px;
        margin: 0 auto;
        padding: clamp(20px, 8vw, 72px) clamp(16px, 5vw, 32px);
        color: var(--ink);
        background: var(--page);
        font-family: var(--mono);
      }

      button,
      input { font: inherit; }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .app {
        display: grid;
        gap: 20px;
      }

      form { display: grid; gap: 6px; }

      label,
      .response-label {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        text-transform: lowercase;
      }

      .prompt-line {
        display: flex;
        border-bottom: 1px solid var(--rule);
      }

      input {
        min-width: 0;
        flex: 1;
        border: 0;
        padding: 8px 0;
        color: var(--ink);
        background: transparent;
        outline: 0;
        font-size: 16px;
      }

      input::placeholder { color: var(--muted); }

      button {
        border: 0;
        padding: 8px 0 8px 12px;
        color: var(--accent);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        text-transform: lowercase;
      }

      button:hover { color: var(--ink); }
      button:disabled { cursor: wait; opacity: 0.55; }

      .response { min-height: 160px; }

      .response-label {
        display: flex;
        align-items: center;
        min-height: 16px;
        gap: 8px;
      }

      .spinner {
        width: 12px;
        height: 12px;
        margin-left: auto;
        border: 1px solid color-mix(in oklch, var(--accent), transparent 50%);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      pre {
        max-width: 65ch;
        min-height: 118px;
        margin: 14px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 20px/1.15 var(--mono);
      }

      .css-rnn-engine {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 0.001ms;
          animation-iteration-count: 1;
        }
      }
    </style>
    <link rel="stylesheet" href="css-model.css?v=4" />
  </head>
  <body>
    <main class="app">
      <form id="promptForm">
        <label for="promptInput">ask</label>
        <div class="prompt-line">
          <input id="promptInput" type="text" maxlength="72" autocomplete="off" placeholder="ask anything" />
          <button id="runButton" type="submit" disabled>ask</button>
        </div>
      </form>

      <output class="response" id="predictionOutput" aria-live="polite" aria-atomic="true" aria-busy="true">
        <div class="response-label">
          <span id="outputLabel">loading</span>
          <span class="spinner" id="loadingIndicator" role="status" aria-label="loading" hidden></span>
        </div>
        <pre id="predictedText" aria-label="Generated response"></pre>
      </output>
    </main>

    <div class="css-rnn-engine" data-css-rnn-engine aria-hidden="true"></div>
    <script type="module" src="script.js?v=7"></script>
  </body>
</html>
